<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Inicio de sesión de CyberHub" />
    <title>Iniciar sesión | CyberHub</title>
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/header-home.css" />
    <link rel="stylesheet" href="../css/login.css" />
  </head>
  <body>
    <!-- Contenedor vacío donde el JavaScript inyectará el header -->
    <div id="header-container" data-template="header-home.html"></div>

    <main class="login-page">
      <h1>Iniciar Sesión</h1>

      <img class="bowser bowser--left" src="../assets/login/5f47d.png" alt="" />

      <form class="login-form" novalidate>
        <div class="form-field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="Ingrese su correo electrónico" required />
          <small></small>
        </div>

        <div class="form-field">
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" placeholder="Ingrese su contraseña" required />
          <small></small>
        </div>

        <div class="auth-buttons">
          <button class="google-auth" type="button" aria-label="Ingresar con Google">
            <img class="google-auth__surface" src="../assets/login/a5ce6.svg" alt="" />
            <img class="google-auth__logo" src="../assets/login/f6cdc.svg" alt="" />
            <img class="google-auth__text" src="../assets/login/3a1a2.svg" alt="" />
            <img class="google-auth__border" src="../assets/login/adc4d.svg" alt="" />
          </button>

          <button class="facebook-auth" type="button">
            <img src="../assets/login/ba87c.svg" alt="" />
            <span>Sign in with Facebook</span>
          </button>
        </div>

        <label class="captcha">
          <input type="checkbox" name="captcha" required />
          <img class="captcha__robot" src="../assets/login/bc9bb.svg" alt="I'm not a robot" />
          <span class="captcha__check" aria-hidden="true">✓</span>
          <span class="captcha__badge">
            <img src="../assets/login/43ba7.svg" alt="" />
            <img src="../assets/login/cf4d1.svg" alt="reCAPTCHA" />
            <img class="captcha__dash" src="../assets/login/bad77.svg" alt="" />
          </span>
        </label>

        <button class="forgot-password" type="button">¿Olvidaste tu contraseña?</button>

        <button class="login-button" type="submit">Iniciar sesión</button>
        <a class="create-account" href="register.html">Crear cuenta Nueva</a>

        <p class="form-message" role="status" aria-live="polite"></p>
      </form>

      <img class="bowser bowser--right" src="../assets/login/5f47d.png" alt="" />

      <dialog class="recovery-dialog">
        <form method="dialog">
          <button class="dialog-close" value="close" aria-label="Cerrar">×</button>
          <h2>Recuperar contraseña</h2>
          <p>Escribe tu correo y te enviaremos las instrucciones.</p>
          <label for="recovery-email">Email</label>
          <input id="recovery-email" type="email" placeholder="correo@ejemplo.com" />
          <button class="send-recovery" value="send">Enviar</button>
        </form>
      </dialog>
    </main>

    <script src="../js/main.js" defer></script>
    <script src="../js/header-home.js" defer></script>
    <script src="../js/login.js" defer></script>
  </body>
</html>
