<svg xmlns="http://www.w3.org/2000/svg" width="192" height="48" viewBox="0 0 192 48" shape-rendering="crispEdges">
  <!--
    SPRITESHEET ITEM 1: CORAZÓN NEÓN / VIDA EXTRA
    4 fotogramas de 48x48px (Total: 192x48px).
    Animación de pulso y brillo neón.
  -->

  <!-- ==================== FRAME 1 (Normal) ==================== -->
  <g transform="translate(0, 0)">
    <!-- Borde exterior fucsia -->
    <rect x="10" y="10" width="10" height="4" fill="#ff2bd6"/>
    <rect x="28" y="10" width="10" height="4" fill="#ff2bd6"/>
    <rect x="6" y="14" width="36" height="12" fill="#ff2bd6"/>
    <rect x="10" y="26" width="28" height="6" fill="#ff2bd6"/>
    <rect x="14" y="32" width="20" height="4" fill="#ff2bd6"/>
    <rect x="18" y="36" width="12" height="4" fill="#ff2bd6"/>
    <rect x="22" y="40" width="4" height="4" fill="#ff2bd6"/>
    <!-- Relleno interior rosa/cian -->
    <rect x="10" y="14" width="10" height="10" fill="#ff5ee0"/>
    <rect x="28" y="14" width="10" height="10" fill="#ff5ee0"/>
    <rect x="14" y="24" width="20" height="8" fill="#ff5ee0"/>
    <!-- Brillo blanco -->
    <rect x="12" y="16" width="4" height="4" fill="#ffffff"/>
  </g>

  <!-- ==================== FRAME 2 (Pulso Grande + Halo Cian) ==================== -->
  <g transform="translate(48, -2)">
    <!-- Halo cian -->
    <rect x="8" y="8" width="12" height="2" fill="#00f0ff"/>
    <rect x="28" y="8" width="12" height="2" fill="#00f0ff"/>
    <rect x="10" y="10" width="10" height="4" fill="#ff2bd6"/>
    <rect x="28" y="10" width="10" height="4" fill="#ff2bd6"/>
    <rect x="6" y="14" width="36" height="12" fill="#ff2bd6"/>
    <rect x="10" y="26" width="28" height="6" fill="#ff2bd6"/>
    <rect x="14" y="32" width="20" height="4" fill="#ff2bd6"/>
    <rect x="18" y="36" width="12" height="4" fill="#ff2bd6"/>
    <rect x="22" y="40" width="4" height="4" fill="#00f0ff"/>
    <!-- Relleno brillante -->
    <rect x="10" y="14" width="28" height="12" fill="#ff7ce8"/>
    <rect x="14" y="26" width="20" height="6" fill="#ff7ce8"/>
    <!-- Cruz cyber interna -->
    <rect x="22" y="18" width="4" height="12" fill="#ffffff"/>
    <rect x="18" y="22" width="12" height="4" fill="#ffffff"/>
  </g>

  <!-- ==================== FRAME 3 (Brillo Máximo) ==================== -->
  <g transform="translate(96, 0)">
    <!-- Destellos en las esquinas -->
    <rect x="4" y="8" width="4" height="4" fill="#00f0ff"/>
    <rect x="40" y="8" width="4" height="4" fill="#00f0ff"/>
    <rect x="4" y="34" width="4" height="4" fill="#00f0ff"/>
    <rect x="40" y="34" width="4" height="4" fill="#00f0ff"/>
    <!-- Corazón -->
    <rect x="10" y="10" width="10" height="4" fill="#00f0ff"/>
    <rect x="28" y="10" width="10" height="4" fill="#00f0ff"/>
    <rect x="6" y="14" width="36" height="12" fill="#ff2bd6"/>
    <rect x="10" y="26" width="28" height="6" fill="#ff2bd6"/>
    <rect x="14" y="32" width="20" height="4" fill="#ff2bd6"/>
    <rect x="18" y="36" width="12" height="4" fill="#ff2bd6"/>
    <rect x="22" y="40" width="4" height="4" fill="#ff2bd6"/>
    <rect x="12" y="16" width="6" height="6" fill="#ffffff"/>
  </g>

  <!-- ==================== FRAME 4 (Pulso Suave) ==================== -->
  <g transform="translate(144, 1)">
    <rect x="10" y="10" width="10" height="4" fill="#ff2bd6"/>
    <rect x="28" y="10" width="10" height="4" fill="#ff2bd6"/>
    <rect x="6" y="14" width="36" height="12" fill="#ff2bd6"/>
    <rect x="10" y="26" width="28" height="6" fill="#ff2bd6"/>
    <rect x="14" y="32" width="20" height="4" fill="#ff2bd6"/>
    <rect x="18" y="36" width="12" height="4" fill="#ff2bd6"/>
    <rect x="22" y="40" width="4" height="4" fill="#ff2bd6"/>
    <rect x="10" y="14" width="10" height="10" fill="#ff5ee0"/>
    <rect x="28" y="14" width="10" height="10" fill="#ff5ee0"/>
    <rect x="12" y="16" width="4" height="4" fill="#00f0ff"/>
  </g>
</svg>
