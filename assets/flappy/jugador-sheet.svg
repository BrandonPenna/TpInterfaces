<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="512" height="64" viewBox="0 0 512 64" shape-rendering="crispEdges">
  <!-- Spritesheet del dron: 8 cuadros de 64x64. Cuadros 0-3 vuelo, cuadros 4-7 explosión. -->
