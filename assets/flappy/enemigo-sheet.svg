<svg xmlns="http://www.w3.org/2000/svg" width="224" height="56" viewBox="0 0 224 56" shape-rendering="crispEdges">
  <!--
    SPRITESHEET ITEM 2: DRON ENEMIGO / MINA CYBER (Obstáculo aéreo que da Turbo / Efecto sin terminar el juego)
    4 fotogramas de 56x56px (Total: 224x56px).
  -->

  <!-- ==================== FRAME 1 (Alas Arriba) ==================== -->
  <g transform="translate(0, 0)">
    <!-- Alas de energía naranja/amarilla arriba -->
    <rect x="6" y="10" width="12" height="8" fill="#ff9900"/>
    <rect x="38" y="10" width="12" height="8" fill="#ff9900"/>
    <rect x="10" y="18" width="8" height="6" fill="#ff3366"/>
    <rect x="38" y="18" width="8" height="6" fill="#ff3366"/>
    <!-- Núcleo del Dron -->
    <rect x="16" y="18" width="24" height="20" fill="#1d1135"/>
    <rect x="14" y="22" width="28" height="12" fill="#2e1a52"/>
    <rect x="16" y="18" width="24" height="3" fill="#ff3366"/>
    <rect x="16" y="35" width="24" height="3" fill="#ff9900"/>
    <!-- Ojo / Sensor Láser Central -->
    <rect x="22" y="24" width="12" height="8" fill="#ff0055"/>
    <rect x="24" y="26" width="6" height="4" fill="#ffff00"/>
  </g>

  <!-- ==================== FRAME 2 (Alas al Centro) ==================== -->
  <g transform="translate(56, 0)">
    <!-- Alas al centro -->
    <rect x="4" y="24" width="10" height="8" fill="#ff9900"/>
    <rect x="42" y="24" width="10" height="8" fill="#ff9900"/>
    <!-- Núcleo -->
    <rect x="16" y="18" width="24" height="20" fill="#1d1135"/>
    <rect x="14" y="22" width="28" height="12" fill="#2e1a52"/>
    <rect x="16" y="18" width="24" height="3" fill="#ff9900"/>
    <rect x="16" y="35" width="24" height="3" fill="#ff3366"/>
    <!-- Ojo brillante -->
    <rect x="20" y="24" width="14" height="8" fill="#ff3366"/>
    <rect x="22" y="26" width="8" height="4" fill="#ffffff"/>
  </g>

  <!-- ==================== FRAME 3 (Alas Abajo) ==================== -->
  <g transform="translate(112, 0)">
    <!-- Alas abajo -->
    <rect x="10" y="32" width="8" height="6" fill="#ff3366"/>
    <rect x="38" y="32" width="8" height="6" fill="#ff3366"/>
    <rect x="6" y="38" width="12" height="8" fill="#ff9900"/>
    <rect x="38" y="38" width="12" height="8" fill="#ff9900"/>
    <!-- Núcleo -->
    <rect x="16" y="18" width="24" height="20" fill="#1d1135"/>
    <rect x="14" y="22" width="28" height="12" fill="#2e1a52"/>
    <rect x="16" y="18" width="24" height="3" fill="#ff3366"/>
    <rect x="16" y="35" width="24" height="3" fill="#ff9900"/>
    <!-- Ojo -->
    <rect x="22" y="24" width="12" height="8" fill="#ff0055"/>
    <rect x="24" y="26" width="6" height="4" fill="#ffff00"/>
  </g>

  <!-- ==================== FRAME 4 (Alas Centro + Descarga) ==================== -->
  <g transform="translate(168, 0)">
    <rect x="4" y="24" width="10" height="8" fill="#ffff00"/>
    <rect x="42" y="24" width="10" height="8" fill="#ffff00"/>
    <rect x="16" y="18" width="24" height="20" fill="#1d1135"/>
    <rect x="14" y="22" width="28" height="12" fill="#2e1a52"/>
    <rect x="16" y="18" width="24" height="3" fill="#ffff00"/>
    <rect x="16" y="35" width="24" height="3" fill="#ff0055"/>
    <rect x="22" y="24" width="12" height="8" fill="#ff0055"/>
    <rect x="24" y="26" width="6" height="4" fill="#ffffff"/>
  </g>
</svg>
